<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>로그인 — WORKNIUM 적산</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
        background: #F1EFEA; color: #1F2A44; font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
      .card { width: 100%; max-width: 360px; background: #fff; border: 1px solid #DDD8CE; border-radius: 12px; padding: 32px 28px; }
      .brand { font-size: 13px; letter-spacing: .12em; color: #38B4A4; font-weight: 700; }
      h1 { margin: 6px 0 24px; font-size: 22px; }
      label { display: block; font-size: 13px; color: #5B6376; margin: 14px 0 6px; }
      input { width: 100%; height: 42px; padding: 0 12px; font-size: 15px; border: 1px solid #CFC9BD; border-radius: 8px; background: #fff; color: inherit; }
      input:focus { outline: 2px solid #38B4A4; outline-offset: -1px; border-color: transparent; }
      button { width: 100%; height: 44px; margin-top: 22px; border: 0; border-radius: 8px; background: #1F2A44; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: .6; cursor: default; }
      #msg { margin: 14px 0 0; padding: 10px 12px; border-radius: 8px; background: #FCEDEA; color: #A1392B; font-size: 13px; line-height: 1.5; }
      .foot { margin-top: 18px; font-size: 12px; color: #8A8F9C; text-align: center; }
    </style>
  </head>
  <body>
    <form class="card" id="f" autocomplete="on">
      <div class="brand">WORKNIUM</div>
      <h1>적산프로그램 로그인</h1>
      <label for="id">아이디</label>
      <input id="id" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required />
      <label for="pw">비밀번호</label>
      <input id="pw" name="password" type="password" autocomplete="current-password" required />
      <p id="msg" hidden></p>
      <button id="go" type="submit">로그인</button>
      <div class="foot">그룹웨어 계정(대표·기술팀)으로도 들어올 수 있어요</div>
    </form>
    <script type="module" src="/src/auth/login.ts"></script>
  </body>
</html>
